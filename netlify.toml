# Plain static site: Netlify should deploy files directly from the repository root.
[build]
  publish = "."

# Consolidated pages: keep existing links and clean URLs working.
[[redirects]]
  from = "/about.html"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/connect.html"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/connect"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/contact.html"
  status = 301
  force = true

# Stable asset URLs are safe because browsers revalidate on every use and
# Netlify invalidates changed static responses when an atomic deploy goes live.
[[headers]]
  for = "/*"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
