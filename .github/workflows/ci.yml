name: CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  static-site:
    name: Static site validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required deploy files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "assets/css/main.css"
            "assets/css/skin-system.css"
            "assets/js/main.js"
            "assets/js/skin-bootstrap.js"
            "assets/js/fridge-poetry.js"
            "assets/data/alec-splash-quotes.json"
            "assets/data/fridge-poetry-words.json"
            "contact.html"
            "thanks.html"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

      - name: Install validation dependencies
        run: npm ci

      - name: Validate nested resources and data
        run: npm run test:resources

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test browser behavior
        run: npm run test:browser

      - name: Test accessibility
        run: npm run test:a11y

      - name: Enforce performance budgets
        run: npm run test:performance

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            .lighthouseci/reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
